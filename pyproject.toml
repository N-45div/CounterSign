[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handshake"
version = "0.1.0"
description = "Signed doorstep delivery receipts, witnessed by a Ring camera"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "cryptography>=43",
]

[project.optional-dependencies]
aws = ["boto3>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["handshake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
