[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handshake"
version = "0.1.0"
description = "Signed doorstep delivery receipts, witnessed by a Ring camera"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "cryptography>=43",
    "fastapi>=0.115",
    "mangum>=0.19",
]

[project.optional-dependencies]
aws = ["boto3>=1.40"]
lab = ["pillow>=10.1", "uvicorn>=0.30"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "moto[dynamodb,s3,sqs,secretsmanager]>=5",
    "pillow>=10.1",
]

[tool.setuptools.packages.find]
include = ["handshake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:There is no current event loop:DeprecationWarning:mangum",
]
